name: product_return_review
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: product_return_review_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: product_return_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
